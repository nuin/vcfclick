[project]
name = "vcfclick"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cyvcf2>=0.31.0",
    "chdb>=4.1.8",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "mcp>=1.0.0",
    "click>=8.1.0",
]

[project.scripts]
vcfclick = "cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "annotations",
    "cli",
    "export",
    "ingest",
    "schema",
    "storage",
    "vcfclick_mcp",
]

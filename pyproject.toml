[project]
name = "vcfclick"
version = "0.5.0"
description = "Small VCF databases. One per cohort. Embedded ClickHouse engine, embedded DuckDB annotations, MCP natural-language layer."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "nuin", email = "nuin@genedrift.org" },
]
keywords = [
    "vcf",
    "bioinformatics",
    "genomics",
    "clickhouse",
    "duckdb",
    "embedded-database",
    "mcp",
    "model-context-protocol",
    "natural-language-sql",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Database",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "cyvcf2>=0.31.0",
    "chdb>=4.1.8",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "mcp>=1.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.89",
]

[project.urls]
Homepage = "https://github.com/nuin/vcfclick"
Repository = "https://github.com/nuin/vcfclick"
Issues = "https://github.com/nuin/vcfclick/issues"
Benchmark = "https://github.com/nuin/vcfclick/blob/main/bench/BENCHMARK.md"

[project.scripts]
vcfclick = "cli.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "annotations",
    "cli",
    "export",
    "ingest",
    "schema",
    "storage",
    "tui",
    "vcfclick_mcp",
]

[tool.hatch.build.targets.sdist]
include = [
    "annotations",
    "cli",
    "export",
    "ingest",
    "schema",
    "storage",
    "tui",
    "vcfclick_mcp",
    "bench/BENCHMARK.md",
    "bench/run.sh",
    "examples",
    "LICENSE",
    "LICENSING.md",
    "README.md",
    "pyproject.toml",
]

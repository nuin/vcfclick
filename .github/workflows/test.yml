name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Force GitHub Actions to run Node-20-built actions under Node 24,
# ahead of the September 2026 hard cutover. Silences the deprecation
# warning that fires on every run for actions/checkout@v4 and
# astral-sh/setup-uv@v6 until those release Node-24-native versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A single push that lands fast wins over many runs of the same SHA.
# Newer pushes to the same ref cancel any in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint runs once (not per matrix cell) and in parallel with `test`.
  # Both must succeed for the workflow to pass. Lint failures are fast
  # to surface and cheap to fix, so we don't gate `test` on `lint` —
  # both run concurrently and the developer sees both signals at once.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff format check
        # uvx runs an ephemeral install of the named tool — no project
        # sync required just for this check. Pinned to a specific
        # version so CI and local (`uv run ruff` via the dev group in
        # pyproject) format identically. Bump together when upgrading.
        run: uvx ruff@0.15.16 format --check .
      - name: ruff lint
        run: uvx ruff@0.15.16 check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is arm64, ubuntu-latest is x86_64 — both are wheel
        # targets for our native deps (cyvcf2, chdb, duckdb, pyarrow).
        # Skipping macos-13 (intel) — chdb intel macOS wheel is rarely
        # tested and the demographic of the project is arm64 + linux.
        os: [ubuntu-latest, macos-14]
        # 3.11 is our floor (requires-python in pyproject); 3.13 is the
        # current stable. 3.12 is the middle ground most users have.
        python-version: ["3.11", "3.12", "3.13"]
        # Linux × 3.12 and 3.13 were previously excluded because chDB
        # 4.x hit `recursive_mutex lock failed: Invalid argument` during
        # EmbeddedServer init. Re-enabling now to see if the retry
        # wrapper in storage.db._open_session_with_retry (commit 0136c74)
        # handles those failures cleanly. Watch the next few CI runs
        # and re-add the exclude block if the wrapper isn't enough.

    steps:
      - uses: actions/checkout@v4

      - name: Install bgzip + tabix + bcftools (htslib utilities)
        # cyvcf2 ships its own htslib, but smoke tests + the routing
        # fixture build use the `bgzip` / `tabix` binaries via
        # subprocess, and the merge tests shell out to `bcftools merge`.
        # Linux: apt's `tabix` package brings bgzip; bcftools is its own
        # package. macOS-14 runners do NOT preinstall these — use brew.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends tabix bcftools
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install htslib bcftools
          fi
          which bgzip
          which tabix
          which bcftools

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project + dev deps
        run: uv sync --extra web --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        # Suite normally completes in 25–90s on CI. The chDB session-init
        # retry wrapper (storage.db._open_session_with_retry) adds bounded
        # backoff variance — 12 minutes gives the retries room without
        # giving up real-hang detection.
        timeout-minutes: 12
        run: uv run pytest tests/ -v

  # DuckDB backend coverage. Smaller matrix than the chDB one because
  # the DuckDB path is pure-Python on top of duckdb's manylinux wheels;
  # any platform-specific regression is overwhelmingly likely to surface
  # on either cell here. Both backends are exercised on every push so
  # bioconda users (DuckDB only) get the same gate as pip users (chDB
  # default).
  test_duckdb:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.13"]

    env:
      VCFCLICK_BACKEND: duckdb

    steps:
      - uses: actions/checkout@v4

      - name: Install bgzip + tabix + bcftools (htslib utilities)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends tabix bcftools
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install htslib bcftools
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project + dev deps
        run: uv sync --extra web --group dev --python ${{ matrix.python-version }}

      - name: Run tests (DuckDB backend)
        # Faster than the chDB matrix because there is no EmbeddedServer
        # init race to retry through. test_stats and the chDB-specific
        # quote-roundtrip test self-skip on this backend.
        timeout-minutes: 8
        run: uv run pytest tests/ -v

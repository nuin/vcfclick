name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A single push that lands fast wins over many runs of the same SHA.
# Newer pushes to the same ref cancel any in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is arm64, ubuntu-latest is x86_64 — both are wheel
        # targets for our native deps (cyvcf2, chdb, duckdb, pyarrow).
        # Skipping macos-13 (intel) — chdb intel macOS wheel is rarely
        # tested and the demographic of the project is arm64 + linux.
        os: [ubuntu-latest, macos-14]
        # 3.11 is our floor (requires-python in pyproject); 3.13 is the
        # current stable. 3.12 is the middle ground most users have.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install bgzip + tabix (htslib utilities)
        # cyvcf2 ships its own htslib, but our smoke-test path uses the
        # `bgzip` / `tabix` binaries via subprocess. Install via apt
        # on Linux, brew (preinstalled) on macOS.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends tabix
          fi
          which bgzip
          which tabix

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project + dev deps
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        # The MCP stdio test spawns a subprocess and waits for the
        # initialize handshake; 5 min ceiling protects against hangs.
        timeout-minutes: 5
        run: uv run pytest tests/ -v

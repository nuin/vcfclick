name: release

on:
  push:
    tags:
      - "v*.*.*"

# Releases are inherently serial — never want two publishes racing.
concurrency:
  group: release

permissions:
  contents: write  # for creating the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify tag matches pyproject version
        # Tag v0.1.2 must correspond to pyproject.toml's version = "0.1.2".
        # Prevents accidental publishes from a mis-tagged commit.
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          TAG="${TAG_REF#v}"
          PYPROJECT_VERSION=$(uv run --no-project --with tomli python -c \
            "import tomli; print(tomli.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Tag version:        $TAG"
          echo "pyproject version:  $PYPROJECT_VERSION"
          if [ "$TAG" != "$PYPROJECT_VERSION" ]; then
            echo "::error::tag v$TAG does not match pyproject version $PYPROJECT_VERSION"
            exit 1
          fi

      - name: Run tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tabix
          uv sync --group dev
          uv run pytest tests/ -q
        timeout-minutes: 10

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_REF: ${{ github.ref_name }}
        # Body is auto-generated from commits since the previous tag.
        # CHANGELOG.md remains the authoritative human-curated record.
        run: |
          gh release create "$TAG_REF" \
            --title "$TAG_REF" \
            --generate-notes \
            dist/*
